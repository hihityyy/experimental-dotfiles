[bar/main]
width = 100%
offset-y = 0
offset-x = 0
padding = 2
height = 24
bottom = true
fixed-center = true
background = #ebdbb2
foreground = #3c3836
font-0 = "Iosevka Nerd Font:size=12;2"
modules-left = bspwm
modules-center = xwindow
modules-right = date

[module/bspwm]
type = internal/bspwm
format = <label-state>
label-focused = %name%
label-focused-foreground = #928374
label-focused-background = #ebdbb2
label-focused-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%

[module/date]
type = internal/date
interval = 1
date = %H:%M
label = %date%
